<!doctype html>
<html lang="{{meta.lang}}" data-lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{meta.title}}</title>
<meta name="description" content="{{meta.description}}">
<link rel="canonical" href="{{url}}">
<link rel="alternate" hreflang="en" href="https://guilhermecassel.com/">
<link rel="alternate" hreflang="pt-BR" href="https://guilhermecassel.com/pt/">
<link rel="alternate" hreflang="x-default" href="https://guilhermecassel.com/">
<meta name="theme-color" content="#0a0e18">

<meta property="og:type" content="website">
<meta property="og:url" content="{{url}}">
<meta property="og:locale" content="{{ogLocale}}">
<meta property="og:title" content="{{meta.title}}">
<meta property="og:description" content="{{meta.description}}">
<meta property="og:image" content="https://guilhermecassel.com/assets/img/og.png">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/system.css">
<link rel="stylesheet" href="/assets/css/site.css">

<script>
  (() => {
    const t = localStorage.getItem('tema');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    document.documentElement.classList.add('js');
  })();
</script>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Guilherme Cassel",
  "jobTitle": ".NET Developer",
  "url": "https://guilhermecassel.com",
  "image": "https://guilhermecassel.com/assets/img/trombone.jpg",
  "sameAs": [
    "https://linkedin.com/in/guilhermecassel",
    "https://github.com/Guilherme-Cassel",
    "https://www.instagram.com/guilherme.cassel2004"
  ],
  "knowsAbout": ["C#", ".NET", "Blazor", "Entity Framework Core", "Azure DevOps", "CI/CD"],
  "address": { "@type": "PostalAddress", "addressRegion": "RS", "addressCountry": "BR" }
}
</script>
</head>

<body>

<div class="bg-layers" aria-hidden="true">
  <div class="blob blob--1"></div>
  <div class="blob blob--2"></div>
  <div class="blob blob--3"></div>
</div>
<div class="grain" aria-hidden="true"></div>

<div class="cursor" data-cursor aria-hidden="true"><span class="cursor__dot"></span></div>

<a class="skip" href="#main" data-t="ui.skipToContent">Skip to content</a>

<header class="topbar" data-topbar>
  <div class="topbar__inner">
    <a class="brandmark" href="#top" aria-label="Guilherme Cassel">
      <svg class="monogram" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="var(--brand)"/>
        <path d="M21.5 11.6A6 6 0 1 0 22 20h-4.4" fill="none" stroke="#fff"
              stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="23.2" cy="16" r="1.9" fill="#fff"/>
      </svg>
      <span class="brandmark__name">Guilherme<span class="brandmark__last"> Cassel</span></span>
    </a>

    <nav class="nav" aria-label="Main">
      <a href="#about"      data-t="nav.about">About</a>
      <a href="#experience" data-t="nav.experience">Experience</a>
      <a href="#work"       data-t="nav.work">Work</a>
      <a href="#stack"      data-t="nav.stack">Stack</a>
      <a href="#music"      data-t="nav.music">Trombone</a>
      <a href="#contact"    data-t="nav.contact">Contact</a>
    </nav>

    <div class="topbar__actions">
      <a class="chip-btn" data-lang-toggle href="{{altUrl}}" hreflang="{{altLang}}" data-label="ui.langToggle">
        <span data-t="ui.langShort">PT</span>
      </a>
      <button class="theme-toggle" data-theme-toggle type="button" data-label="ui.themeToggle">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
        </svg>
      </button>
      <button class="chip-btn nav-toggle" data-nav-toggle type="button" data-label="ui.menu" aria-expanded="false" aria-controls="mobile-nav">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
      </button>
    </div>
  </div>

  <nav class="mobile-nav" id="mobile-nav" data-mobile-nav hidden aria-label="Main"></nav>
</header>

<main id="main">
  <span id="top"></span>

  <section class="hero page">
    <p class="eyebrow" data-t="hero.kicker"></p>

    <div class="hero__palco" data-palco>
      <div class="hero__trilho" data-trilho>
        <h1 class="hero__name" data-nome>
          <button class="tickle" data-tickle type="button" data-t="hero.name">Guilherme Cassel</button>
        </h1>
      </div>
    </div>

    <p class="hero__role" aria-hidden="true">
      <span class="hero__role-prefix">&gt;</span>
      <span class="hero__role-texto"><span data-typewriter></span><span class="caret" aria-hidden="true"></span></span>
    </p>

    <p class="lead hero__lead" data-t="hero.lead"></p>

    <div class="row hero__cta">
      <a class="btn btn--magnetic" data-cv href="#">
        <span data-t="hero.ctaResume"></span>
      </a>
      <a class="btn btn--ghost btn--magnetic" data-link="linkedin" href="#" target="_blank" rel="noopener">
        <span data-t="hero.ctaPrimary"></span>
      </a>
      <a class="btn btn--ghost btn--magnetic" data-link="github" href="#" target="_blank" rel="noopener">
        <span data-t="hero.ctaSecondary"></span>
      </a>
    </div>
  </section>

  <section class="page stats-section" aria-label="Numbers">
    <div class="stats" data-stats></div>
  </section>

  <section class="page" id="about">
    <p class="eyebrow" data-t="about.eyebrow"></p>
    <h2 data-t="about.title"></h2>

    <!-- A história em cinco paradas, pra quem não vai ler os parágrafos.
         Os desenhos ficam aqui; o texto de cada parada vem do JSON. -->
    <svg class="so-desenhos" aria-hidden="true">
      <symbol id="fase-redstone" viewBox="0 0 24 24"><path d="M12 12v8M9 20h6"/><rect x="9.500" y="5" width="5" height="7" rx="1"/><path d="M12 2v1M6.500 4.500l.8.8M17.500 4.500l-.8.8"/></symbol>
      <symbol id="fase-campo" viewBox="0 0 24 24"><path d="M14.500 6.500a4 4 0 0 0 5 5L11 20a2.100 2.100 0 0 1-3-3Z"/><path d="M14.500 6.500 17 4l3 3-2.500 2.500"/></symbol>
      <symbol id="fase-codigo" viewBox="0 0 24 24"><path d="m8 7-5 5 5 5M16 7l5 5-5 5M13.500 5l-3 14"/></symbol>
      <symbol id="fase-suporte" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></symbol>
      <symbol id="fase-dev" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></symbol>
    </svg>
    <ol class="fases" data-fases></ol>

    <div class="about">
      <div class="about__text" data-about-text></div>
      <aside class="about__aside">
        <figure class="photo photo--soft">
          <picture>
            <source srcset="/assets/img/pantufas.webp" type="image/webp">
            <img src="/assets/img/pantufas.jpg" width="1200" height="904"
                 loading="lazy" decoding="async" data-alt="personal.photoAlt" data-title="personal.photoTitle" alt="">
          </picture>
          <figcaption data-t="personal.photoCaption"></figcaption>
        </figure>
        <blockquote class="motto">
          <p data-t="about.motto"></p>
          <cite data-t="about.mottoOriginal"></cite>
        </blockquote>
      </aside>
    </div>
  </section>

  <section class="page" id="jogo">
    <p class="eyebrow" data-t="game.eyebrow"></p>
    <h2 data-t="game.title"></h2>
    <p class="lead" data-t="game.lead"></p>

    <p class="jogo__acao">
      <button class="btn btn--magnetic" type="button" data-jogo-abrir>
        <span data-t="game.play"></span>
      </button>
    </p>

    <div class="jogo__palco" data-jogo-palco>
      <div class="jogo__tela">
        <canvas data-jogo-canvas tabindex="0" role="img" data-label="game.title"></canvas>

        <div class="jogo__hud">
          <span><span data-t="game.score"></span> <b data-jogo-pontos>0</b></span>
          <span><span data-t="game.best"></span> <b data-jogo-recorde>0</b></span>
          <span class="jogo__modo" data-t="game.hard"></span>
          <button class="jogo__som" type="button" data-jogo-som
                  data-label="game.soundToggle" aria-pressed="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 5 6 9H3v6h3l5 4z"/>
              <path class="jogo__som-ondas" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>
              <path class="jogo__som-corte" d="m16 9 5 6M21 9l-5 6"/>
            </svg>
          </button>
        </div>

        <p class="jogo__dica" data-t="game.hint"></p>

        <div class="jogo__aviso" data-jogo-aviso hidden>
          <p data-jogo-mensagem></p>
          <button class="btn" type="button" data-jogo-reiniciar>
            <span data-t="game.again"></span>
          </button>
        </div>
      </div>
    </div>

    <p class="muted jogo__nota" data-t="game.footnote"></p>
  </section>

  <section class="page" id="experience">
    <p class="eyebrow" data-t="experience.eyebrow"></p>
    <h2 data-t="experience.title"></h2>
    <ol class="timeline" data-timeline></ol>
  </section>

  <section class="page" id="work">
    <p class="eyebrow" data-t="projects.eyebrow"></p>
    <h2 data-t="projects.title"></h2>
    <p class="lead" data-t="projects.lead"></p>

    <div class="work" data-work></div>

    <h3 class="side__title" data-t="projects.sideTitle"></h3>
    <p class="muted" data-t="projects.sideLead"></p>
    <div class="side" data-side></div>

    <!-- O friendly-password-generator pra experimentar aqui mesmo.
         Comportamento em assets/js/senha.js, baixado sob demanda. -->
    <div class="senha card" data-senha>
      <h4 data-t="password.title"></h4>
      <p class="muted" data-t="password.lead"></p>
      <output class="senha__saida" data-senha-saida aria-live="polite"></output>
      <div class="row senha__acoes">
        <button class="btn" type="button" data-senha-gerar><span data-t="password.generate"></span></button>
        <button class="btn btn--ghost" type="button" data-senha-copiar disabled><span data-t="password.copy"></span></button>
        <label class="senha__palavras">
          <span data-t="password.words"></span>
          <input type="range" min="2" max="5" step="1" value="3" data-senha-palavras>
          <b data-senha-n>3</b>
        </label>
      </div>
      <p class="muted senha__nota" data-t="password.footnote"></p>
    </div>
  </section>

  <section class="page" id="stack">
    <p class="eyebrow" data-t="stack.eyebrow"></p>
    <h2 data-t="stack.title"></h2>
    <p class="lead" data-t="stack.lead"></p>
    <div class="stack-groups" data-stack></div>
  </section>

  <section class="page" id="music">
    <div class="music">
      <div class="music__text">
        <p class="eyebrow" data-t="music.eyebrow"></p>
        <h2 data-t="music.title"></h2>
        <div data-music-text></div>
      </div>
      <figure class="photo">
        <picture>
          <source srcset="/assets/img/trombone.webp" type="image/webp">
          <img src="/assets/img/trombone.jpg" width="1191" height="795"
               loading="lazy" decoding="async" data-alt="music.photoAlt" alt="">
        </picture>
        <figcaption data-t="music.photoCaption"></figcaption>
      </figure>
    </div>

    <!-- O trombone tocável. O comportamento mora em assets/js/trombone.js,
         que só é baixado quando esta seção chega perto da tela. -->
    <div class="trombone card" data-trombone>
      <div class="trombone__topo">
        <div>
          <h3 data-t="trombone.title"></h3>
          <p class="muted" data-t="trombone.lead"></p>
        </div>
        <p class="trombone__leitura" aria-live="off">
          <span data-t="trombone.position"></span> <b data-trombone-posicao>1</b>
          <span class="trombone__nota" data-trombone-nota>F3</span>
        </p>
      </div>

      <div class="trombone__vara" data-trombone-vara role="slider" tabindex="0"
           aria-valuemin="1" aria-valuemax="7" aria-valuenow="1" data-label="trombone.slide">
        <svg viewBox="0 0 660 132" aria-hidden="true">
          <!-- a parte que não se mexe: campana, bocal e os tubos internos -->
          <g class="trombone__fixo">
            <path class="trombone__campana" d="M150 34 C110 34 70 30 18 8 L18 68 C70 46 110 42 150 42 Z"/>
            <path d="M150 38 H392" />
            <path d="M118 94 H392" />
            <path class="trombone__bocal" d="M96 86 L118 91 V97 L96 102 Z"/>
            <path d="M150 38 V20 H250 V38" />
          </g>
          <!-- a vara: é este grupo que anda -->
          <g class="trombone__movel">
            <path d="M176 38 H420 A28 28 0 0 1 420 94 H176" />
            <path class="trombone__trava" d="M196 38 V94" />
            <circle class="trombone__pega" cx="448" cy="66" r="9"/>
          </g>
          <!-- as sete posições -->
          <g class="trombone__marcas">
            <text x="448" y="126">1</text><text x="476" y="126">2</text><text x="504" y="126">3</text>
            <text x="532" y="126">4</text><text x="560" y="126">5</text><text x="588" y="126">6</text>
            <text x="616" y="126">7</text>
          </g>
        </svg>
      </div>

      <div class="trombone__base">
        <div class="trombone__parciais" role="group" data-label="trombone.partials">
          <span class="muted" data-t="trombone.partials"></span>
          <button type="button" class="chip-btn" data-trombone-parcial="0">B♭2</button>
          <button type="button" class="chip-btn" data-trombone-parcial="1" aria-pressed="true">F3</button>
          <button type="button" class="chip-btn" data-trombone-parcial="2">B♭3</button>
          <button type="button" class="chip-btn" data-trombone-parcial="3">D4</button>
        </div>
        <p class="muted trombone__dica" data-t="trombone.hint"></p>
      </div>
    </div>
  </section>

  <section class="page" id="contact">
    <div class="contact card">
      <p class="eyebrow" data-t="contact.eyebrow"></p>
      <h2 data-t="contact.title"></h2>
      <p class="lead" data-t="contact.lead"></p>
      <div class="row contact__actions">
        <a class="btn btn--magnetic" data-email href="#"><span data-t="contact.emailLabel"></span></a>
        <a class="btn btn--ghost" data-cv href="#"><span data-t="contact.cvLabel"></span></a>
        <span class="contact__links" data-contact-links></span>
      </div>
    </div>
  </section>
</main>

<footer class="page site-footer">
  <p data-t="footer.built"></p>
  <p class="muted">
    <span data-t="footer.rights"></span> ·
    <a class="link" href="https://github.com/Guilherme-Cassel" target="_blank" rel="noopener" data-t="footer.source"></a>
  </p>
  <!-- Um d20 no rodapé. Quem achou, achou. (assets/js/segredos.js) -->
  <button class="d20" type="button" data-d20 data-label="eggs.roll">
    <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true">
      <path d="M16 2 28.1 9v14L16 30 3.9 23V9Z"/>
      <path d="M16 9.5 22.5 20.5h-13Z"/>
      <path d="M16 2v7.5M3.9 9 16 9.5 28.1 9M9.500 20.5 3.9 23M22.5 20.5 28.1 23M9.5 20.5 16 30l6.5-9.5M3.9 9l5.6 11.5M28.1 9l-5.600 11.5"/>
    </svg>
  </button>
</footer>

<script src="/assets/js/site.js" defer></script>

</body>
</html>
