# =============================================================
# Publica o site no Cloudflare Pages a cada push na main.
#
# Não tem build: o site é estático de verdade, então o job só
# copia a pasta pro Cloudflare. Por isso ele roda em segundos.
#
# ANTES DO PRIMEIRO DEPLOY, criar dois segredos no repositório
# (Settings › Secrets and variables › Actions):
#   CLOUDFLARE_API_TOKEN   = token com a permissão "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  = o Account ID que aparece no painel da Cloudflare
# E criar o projeto no Cloudflare Pages com o nome abaixo.
#
# Alternativa sem nenhum segredo: no painel do Cloudflare Pages dá
# pra conectar o repositório direto e ele publica sozinho a cada
# push. Este workflow existe porque a esteira ser explícita, versionada
# e legível no repositório é metade do argumento do portfólio.
# =============================================================
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:      # permite publicar na mão pelo botão do GitHub

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true   # push novo cancela o deploy anterior

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Conferir que o conteúdo é JSON válido
        # Barato e evita o pior erro possível aqui: uma vírgula a mais
        # no content/pt.json derrubaria o texto do site inteiro.
        run: |
          for arquivo in content/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$arquivo','utf8'))" \
              && echo "ok  $arquivo" || exit 1
          done

      - name: Publicar no Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=guilhermecassel --branch=main
